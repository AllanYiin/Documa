[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "documa"
version = "0.2.2"
description = "LLM-ready document understanding package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Documa contributors" }]
keywords = ["pdf", "document-understanding", "rag", "mcp", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
]
# filelock is the sole runtime dependency (pure Python, zero transitive deps):
# it guards registry read-modify-write against concurrent MCP/CLI processes.
# Any new runtime dependency must document its justification here.
dependencies = ["filelock>=3.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-regressions>=2.5", "jsonschema>=4.21"]
pdf = ["PyMuPDF>=1.24"]
ocr = ["rapidocr-onnxruntime>=1.3"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=1.0"]
html = ["beautifulsoup4>=4.12"]
msg = ["extract-msg>=0.49"]
ipynb = ["nbformat>=5.10"]
documents = [
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "extract-msg>=0.49",
  "nbformat>=5.10",
]
mcp = ["mcp>=1.0"]
# Real token counting for query budgets: chars/4-style heuristics are banned,
# so token fields stay null unless one of these counters is available.
tokens = ["tiktoken>=0.7"]
anthropic-tokens = ["anthropic>=0.30"]
demo = ["tiktoken>=0.7", "openai>=1.0"]

[project.scripts]
documa = "documa.cli:main"
documa-mcp = "documa.interfaces.mcp_server:main"

[project.urls]
Repository = "https://github.com/AllanYiin/Documa"
Documentation = "https://github.com/AllanYiin/Documa#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "ocr: tests that need the documa[ocr] extra (RapidOCR); skipped when it is not installed",
]
