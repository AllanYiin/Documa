[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documa"
version = "0.1.0"
description = "LLM-ready document understanding package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Documa contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["PyMuPDF>=1.24"]

[project.scripts]
documa = "documa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
