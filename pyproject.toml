[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "documa"
version = "0.1.0"
description = "LLM-ready document understanding package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Documa contributors" }]
keywords = ["pdf", "document-understanding", "rag", "mcp", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["PyMuPDF>=1.24"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=1.0"]
html = ["beautifulsoup4>=4.12"]
msg = ["extract-msg>=0.49"]
ipynb = ["nbformat>=5.10"]
documents = [
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "extract-msg>=0.49",
  "nbformat>=5.10",
]
mcp = ["mcp>=1.0"]
demo = ["tiktoken>=0.7", "openai>=1.0"]

[project.scripts]
documa = "documa.cli:main"
documa-mcp = "documa.interfaces.mcp_server:main"

[project.urls]
Repository = "https://github.com/AllanYiin/Documa"
Documentation = "https://github.com/AllanYiin/Documa#readme"

[tool.setuptools.packages.find]
where = ["src"]
