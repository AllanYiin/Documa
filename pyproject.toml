[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documa"
version = "0.1.0"
description = "LLM-ready document understanding package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Documa contributors" }]
keywords = ["pdf", "document-understanding", "rag", "mcp", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["PyMuPDF>=1.24"]
mcp = ["mcp>=1.0"]
demo = ["tiktoken>=0.7", "openai>=1.0"]

[project.scripts]
documa = "documa.cli:main"
documa-mcp = "documa.interfaces.mcp_server:main"

[project.urls]
Repository = "https://github.com/AllanYiin/Documa"
Documentation = "https://github.com/AllanYiin/Documa#readme"

[tool.setuptools.packages.find]
where = ["src"]
