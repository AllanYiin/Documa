[build-system]
requires = ["setuptools>=77.0.3", "setuptools-rust>=1.11,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "documa"
version = "0.8.0"
description = "LLM-ready document understanding package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "native/office/LICENSE",
  "native/pdf/LICENSE",
  "native/pdf/THIRD_PARTY_NOTICES.md",
  "native/lingxi/LICENSE",
  "native/lingxi/ASSETS.md",
]
authors = [{ name = "Documa contributors" }]
keywords = ["pdf", "document-understanding", "rag", "mcp", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
]
# The default install is the complete non-OCR agent runtime: all supported
# document adapters, MCP transport, and a real local token counter. OCR stays
# optional because ONNX Runtime/OpenCV add substantial native dependencies.
dependencies = [
  "filelock>=3.12",
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "extract-msg>=0.49",
  "nbformat>=5.10",
  "mcp>=1.0,<3",
  "tiktoken>=0.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-regressions>=2.5", "jsonschema>=4.21"]
# Backward-compatible granular extras. Their dependencies are already included
# by the default runtime; keep the names so existing install commands still work.
pdf = ["PyMuPDF>=1.24"]
ocr = ["rapidocr-onnxruntime>=1.3"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=1.0"]
# Backward-compatible extra name. The extension is now built from vendored
# source under native/office instead of installed as a separate distribution.
office-rust = []
html = ["beautifulsoup4>=4.12"]
msg = ["extract-msg>=0.49"]
ipynb = ["nbformat>=5.10"]
documents = [
  "PyMuPDF>=1.24",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "extract-msg>=0.49",
  "nbformat>=5.10",
]
mcp = ["mcp>=1.0,<3"]
# Real token counting for query budgets: chars/4-style heuristics are banned.
tokens = ["tiktoken>=0.7"]
# Optional multi-language code graph adapters. Python's authoritative AST
# analyzer remains dependency-free in the base runtime.
code = ["tree-sitter>=0.25,<0.26", "protobuf>=5"]
# The public full-install path: default runtime plus local CPU OCR.
all = ["rapidocr-onnxruntime>=1.3"]
anthropic-tokens = ["anthropic>=0.30"]
demo = ["openai>=1.0"]

[project.scripts]
documa = "documa.cli:main"
documa-mcp = "documa.interfaces.mcp_server:main"

[project.urls]
Repository = "https://github.com/AllanYiin/Documa"
Documentation = "https://github.com/AllanYiin/Documa#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"documa._vendor.lingxi" = ["assets/*.bin"]

[tool.pytest.ini_options]
markers = [
  "ocr: tests that need the documa[all] extra (RapidOCR); skipped when it is not installed",
]
