  text:
    normalized_text: Verify supply ripple stays below the published limit before connecting
      the analog front end. Route the sensorharness away from switching converters.
      Confirm that the acquisition host applies the vendor timestamprather than re-stamping
      frames on arrival, since downstream alignment assumes source timestamps. After
      first power-up, run the built-in self test and archive the report it produces.
      The report is the baselineused by support when diagnosing drift claims during
      the warranty period.
    raw_text: Verify supply ripple stays below the published limit before connecting
      the analog front end. Route the sensorharness away from switching converters.
      Confirm that the acquisition host applies the vendor timestamprather than re-stamping
      frames on arrival, since downstream alignment assumes source timestamps. After
      first power-up, run the built-in self test and archive the report it produces.
      The report is the baselineused by support when diagnosing drift claims during
      the warranty period.
