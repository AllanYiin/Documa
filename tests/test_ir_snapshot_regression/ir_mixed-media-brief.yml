  text:
    normalized_text: The array ships pre-calibrated. Field recalibration is only required
      after mechanical shock or when operatingtemperature moves outside the rated
      band for more than an hour. Mount the unit on the vibration isolatorsprovided;
      rigid mounting couples structural noise directly into the low-frequency channels
      and can maskweak signals entirely.
    raw_text: The array ships pre-calibrated. Field recalibration is only required
      after mechanical shock or when operatingtemperature moves outside the rated
      band for more than an hour. Mount the unit on the vibration isolatorsprovided;
      rigid mounting couples structural noise directly into the low-frequency channels
      and can maskweak signals entirely.
    simplified_traditional_converted: false
    unicode_form: NFC
    width_normalized: false
