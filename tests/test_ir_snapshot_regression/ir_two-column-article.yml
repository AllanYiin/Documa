  text:
    normalized_text: The second parameter is loss. Dissipative layersflatten the resonance
      structure and widen the usableband at the cost of peak transmission. Designerstherefore
      alternate low-loss and high-loss layers toshape the response. Figure 1 summarises
      the measurement setup usedthroughout this article. A swept source drives thestack
      from the left while a calibrated receiversamples the transmitted field on the
      right.
