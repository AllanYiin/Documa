  text:
    normalized_text: A short synthetic article for layout testing Layered media introduce
      boundary effects thatdominate propagation behaviour at shortwavelengths. When
      a signal crosses an interface,part of its energy reflects while the remainderrefracts
      into the next layer. The balance betweenthe two depends on the impedance contrast
      at theboundary. In practical assemblies the layers are rarely uniform.Thickness
      variation of only a few percent shifts theinterference pattern enough to move
      resonancepeaks by a measurable margin, which is whymanufacturing tolerance is
      the first parameterengineers examine.
    raw_text: A short synthetic article for layout testing Layered media introduce
      boundary effects thatdominate propagation behaviour at shortwavelengths. When
      a signal crosses an interface,part of its energy reflects while the remainderrefracts
