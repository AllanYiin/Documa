name: Office parser CI

on:
  push:
    paths: ["native/office/**", "src/rust_office/**", ".github/workflows/office-parser.yml"]
  pull_request:
    paths: ["native/office/**", "src/rust_office/**", ".github/workflows/office-parser.yml"]
  workflow_dispatch:
    inputs:
      require_release_ready:
        description: Require reviewed real-world corpus before release
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: native/office

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python -m pip install maturin pytest jsonschema
          python-docx==1.2.0 openpyxl==3.1.2 python-pptx==1.0.2
          xlwt==1.3.0 xlrd==2.0.1 psutil==6.0.0
      - run: python scripts/generate_fixtures.py
      - run: git diff --exit-code -- fixtures
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p office-cli --locked
      - run: maturin build --release --locked --out dist
      - shell: bash
        run: |
          python -m pip install --no-deps --target .wheel-smoke dist/*.whl
          PYTHONPATH=.wheel-smoke python -m pytest -q tests --junitxml=reports/pytest.xml
          PYTHONPATH=.wheel-smoke python scripts/corpus.py check > reports/corpus.json
          PYTHONPATH=.wheel-smoke python scripts/verify_real_world.py
          PYTHONPATH=.wheel-smoke python scripts/benchmark_scaling.py --out reports/scaling.json
      - if: ${{ inputs.require_release_ready }}
        shell: bash
        run: PYTHONPATH=.wheel-smoke python scripts/corpus.py check --require-real-world
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            native/office/dist/*.whl
            native/office/reports/pytest.xml
            native/office/reports/corpus.json
            native/office/reports/real-world-parity.json
            native/office/reports/scaling.json
          if-no-files-found: warn
          retention-days: 7

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 check --workspace --locked

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ooxml -- -max_total_time=10
      - run: cargo +nightly fuzz run relationships -- -max_total_time=10
      - run: cargo +nightly fuzz run biff -- -max_total_time=10
      - run: cargo +nightly fuzz run pptx -- -max_total_time=10
      - run: cargo +nightly fuzz run docx -- -max_total_time=10
      - run: cargo +nightly fuzz run xlsx -- -max_total_time=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: native/office/fuzz/artifacts/
          if-no-files-found: ignore
