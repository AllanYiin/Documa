name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package
        run: python -m pip install -e ".[dev,documents]"
      - name: Check schema is in sync with IR dataclasses
        run: python scripts/generate_schema.py --check
      - name: Validate agent plugins
        run: python scripts/validate_agent_plugins.py
      - name: Check plugin zips are in sync with plugin sources
        run: python scripts/package_plugins.py --check
      - name: Run tests
        run: python -m pytest
      - name: Run Documa doctor
        run: documa doctor

  # Observational quality gate: never blocks merges while thresholds are being
  # calibrated. Promotion to a hard gate is documented in CHANGELOG.md.
  quality-benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,documents]"
      - name: Run quality benchmark
        continue-on-error: true
        run: documa benchmark --mode quality --out bench.json
      - name: Publish score summary
        run: python .github/scripts/benchmark_summary.py bench.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-benchmark
          path: bench.json
          retention-days: 30
