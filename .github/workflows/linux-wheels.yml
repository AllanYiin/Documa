name: Linux wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.target.arch }} / ${{ matrix.python }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312]
        target:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Build inside manylinux, not against the runner's newer glibc.
      # Rust must be installed inside that container as well.
      - name: Build and test installed wheel
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_${{ matrix.target.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.target.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            -o /tmp/documa-rustup.sh &&
            sh /tmp/documa-rustup.sh -y --profile minimal --default-toolchain stable
          CIBW_ENVIRONMENT_LINUX: >-
            PATH=$HOME/.cargo/bin:$PATH
            DOCUMA_TOKEN_COUNTER=tiktoken:o200k_base
          # This release smoke checks all native imports, bundled LingXi,
          # and MCP process/summary/source references from the installed wheel.
          CIBW_TEST_COMMAND: >-
            python -I {project}/scripts/smoke_installed_release.py &&
            python -m pip check

      - name: Record wheel checksums
        working-directory: wheelhouse
        run: sha256sum ./*.whl > SHA256SUMS.txt

      - name: Upload tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: documa-linux-${{ matrix.target.arch }}-${{ matrix.python }}
          path: |
            wheelhouse/*.whl
            wheelhouse/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
