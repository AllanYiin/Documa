[workspace]
resolver = "2"
members = [
  "crates/office-core",
  "crates/office-ooxml",
  "crates/office-word",
  "crates/office-sheet",
  "crates/office-slide",
  "crates/office-py",
  "crates/office-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.23"
calamine = { version = "0.36.1", features = ["picture"] }
cfb = "0.14"
clap = { version = "4.6.5", features = ["derive"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.19"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1

