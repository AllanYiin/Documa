[workspace]
resolver = "2"
members = [
    "crates/pdf-core",
    "bindings/python",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/rust-pdf-parser"

[workspace.dependencies]
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
pdf-core = { version = "0.2.0", path = "crates/pdf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
