[package]
name = "pdf-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the from-scratch Rust PDF parser"

[features]
default = []
ocr-onnx = ["dep:pdf-ocr", "pdf-ocr/rapidocr-onnx"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-core.workspace = true
pyo3 = { version = "0.29" }
pdf-ocr = { workspace = true, optional = true }
serde_json.workspace = true

[lints.clippy]
all = "warn"
pedantic = "warn"

