[graph]
all-features = true
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "lopdf", reason = "Existing PDF parser is forbidden" },
    { name = "pdf", reason = "Existing PDF parser is forbidden" },
    { name = "pdfium-render", reason = "PDFium wrapper is forbidden" },
    { name = "mupdf", reason = "MuPDF wrapper is forbidden" },
    { name = "poppler-rs", reason = "Poppler wrapper is forbidden" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
