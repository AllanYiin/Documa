[package]
name = "lingxi-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LingXi 分詞的 Python binding（PyO3 + maturin）"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
lingxi-core = { path = "../lingxi-core" }
pyo3 = { version = "0.23", features = ["abi3-py39", "extension-module"] }
rayon = "1"
