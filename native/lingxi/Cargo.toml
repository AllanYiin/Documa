[workspace]
resolver = "2"
members = ["crates/lingxi-core", "crates/lingxi-py"]

[workspace.package]
version = "0.4.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
daachorse = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1
